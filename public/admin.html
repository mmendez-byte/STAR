<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#030a15">
<title>Administración · Proyecto STAR</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/sgo-tokens.css">
<link rel="stylesheet" href="/assets/css/sgo-components.css">
<link rel="stylesheet" href="/assets/css/portal.css">
</head>
<body class="page page--hub">
<header class="topbar">
  <span class="topbar__brand">
    <img src="/assets/img/sullairgo-logo.jpg" alt="SullairGo" class="logo-on-dark">
    <span class="topbar__project">Proyecto STAR · Admin</span>
  </span>
  <a class="topbar__action" href="/admin/salir">Salir del modo admin</a>
</header>
<main class="hub">
  <div class="hub__header">
    <p class="eyebrow">Proyecto STAR</p>
    <h1>Administración</h1>
  </div>
  <div class="tabs" role="tablist" aria-label="Secciones de administración">
    <button type="button" role="tab" id="tab-comentarios" aria-controls="panel-comentarios" aria-selected="true">Comentarios de testers</button>
    <button type="button" role="tab" id="tab-notas" aria-controls="panel-notas" aria-selected="false" tabindex="-1">Notas de reuniones</button>
  </div>
  <section id="panel-comentarios" role="tabpanel" aria-labelledby="tab-comentarios">
  <div class="admin-bar">
  <div class="filter" role="radiogroup" aria-label="Filtrar por estado">
    <label><input type="radio" name="estado" value="abierto" checked><span>Abiertos <b data-count="abierto">0</b></span></label>
    <label><input type="radio" name="estado" value="resuelto"><span>Resueltos <b data-count="resuelto">0</b></span></label>
    <label><input type="radio" name="estado" value="todos"><span>Todos <b data-count="todos">0</b></span></label>
  </div>
  <button type="button" class="hub__board admin-csv" id="csv">Descargar CSV</button>
  </div>
  <div class="table-wrap">
    <table class="comments-table">
      <thead>
        <tr><th scope="col">Pantalla</th><th scope="col">Comentario</th><th scope="col">Quién</th><th scope="col">Vista</th><th scope="col">Fecha</th><th scope="col"><span class="sr-only">Acciones</span></th></tr>
      </thead>
      <tbody id="rows"><tr><td colspan="6" class="comments-table__empty">Cargando comentarios…</td></tr></tbody>
    </table>
  </div>
  </section>

  <section id="panel-notas" role="tabpanel" aria-labelledby="tab-notas" hidden>
    <div class="notes">
      <div class="notes__main">
        <div class="notes__toolbar">
          <label for="nota-fecha">Fecha de la reunión</label>
          <div class="notes__date">
            <button type="button" class="notes__step" data-step="-1" aria-label="Día anterior"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg></button>
            <input type="date" id="nota-fecha">
            <button type="button" class="notes__step" data-step="1" aria-label="Día siguiente"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg></button>
            <button type="button" class="notes__today" id="nota-hoy">Hoy</button>
          </div>
        </div>
        <div class="notes__card">
          <p class="notes__day" id="nota-dia"></p>
          <input id="nota-titulo" class="notes__title" placeholder="Título (por ejemplo: Weekly STAR)" maxlength="200" aria-label="Título de la reunión">
          <textarea id="nota-contenido" class="notes__text" placeholder="Notas de la reunión: definiciones, pendientes, quién hace qué…" aria-label="Notas de la reunión"></textarea>
          <div class="notes__footer">
            <span id="nota-estado" class="notes__status" role="status">Sin cambios</span>
            <button type="button" class="link danger" id="nota-borrar">Borrar nota</button>
          </div>
        </div>
      </div>
      <aside class="notes__aside" aria-labelledby="notas-titulo">
        <h2 id="notas-titulo">Reuniones anotadas</h2>
        <ol class="notes__list" id="notas-lista"><li class="notes__empty">Cargando…</li></ol>
      </aside>
    </div>
  </section>
</main>
<script src="/app/data.js"></script>
<script>
// Administración: todos los comentarios de los testers. Marcar resueltos, reabrir, borrar y exportar.
(function () {
  var titles = {};
  window.STAR.SCENARIOS.forEach(function (s) { titles[s.id] = s.title; });
  var comments = [];
  var filter = "abierto";
  var rows = document.getElementById("rows");
  var fmt = new Intl.DateTimeFormat("es-AR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  function esc(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function paint() {
    var counts = { abierto: 0, resuelto: 0, todos: comments.length };
    comments.forEach(function (c) { counts[c.estado]++; });
    Object.keys(counts).forEach(function (k) { document.querySelector('[data-count="' + k + '"]').textContent = counts[k]; });
    var visible = comments.filter(function (c) { return filter === "todos" || c.estado === filter; });
    if (!visible.length) {
      rows.innerHTML = '<tr><td colspan="6" class="comments-table__empty">' +
        (filter === "abierto" ? "No hay comentarios abiertos." : filter === "resuelto" ? "Todavía no se resolvió ningún comentario." : "Todavía no hay comentarios.") + "</td></tr>";
      return;
    }
    rows.innerHTML = visible.map(function (c) {
      var resolved = c.estado === "resuelto";
      return '<tr' + (resolved ? ' class="is-resolved"' : "") + '>' +
        '<td data-label="Pantalla"><a class="screen-link" href="/escenarios/' + esc(c.escenario) + '"><span class="code">' + esc(c.escenario) + '</span>' + esc(titles[c.escenario] || "") + '</a></td>' +
        '<td data-label="Comentario" class="comments-table__text">' + esc(c.comentario) + '</td>' +
        '<td data-label="Quién">' + esc(c.nombre) + '</td>' +
        '<td data-label="Vista">' + (c.vista === "desktop" ? "Desktop" : "Celular") + '</td>' +
        '<td data-label="Fecha" class="nowrap">' + esc(fmt.format(new Date(c.creado))) + '</td>' +
        '<td data-label="Acciones"><div class="row-actions"><button type="button" class="state-btn" data-id="' + c.id + '">' + (resolved ? "Reabrir" : "Marcar resuelto") + '</button>' +
        '<button type="button" class="link danger" data-delete="' + c.id + '">Borrar</button></div></td>' +
        '</tr>';
    }).join("");
  }
  document.querySelector(".filter").addEventListener("change", function (e) { filter = e.target.value; paint(); });
  rows.addEventListener("click", function (e) {
    var del = e.target.closest("[data-delete]");
    if (del) {
      var delId = Number(del.getAttribute("data-delete"));
      if (!window.confirm("¿Borrar este comentario? No se puede deshacer.")) return;
      fetch("/api/comentarios/" + delId, { method: "DELETE" }).then(function (r) {
        if (r.ok) comments = comments.filter(function (x) { return x.id !== delId; });
        paint();
      });
      return;
    }
    var btn = e.target.closest("[data-id]");
    if (!btn) return;
    var id = Number(btn.getAttribute("data-id"));
    var c = comments.filter(function (x) { return x.id === id; })[0];
    btn.disabled = true;
    fetch("/api/comentarios/" + id, {
      method: "PATCH",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ estado: c.estado === "resuelto" ? "abierto" : "resuelto" }),
    }).then(function (r) { return r.json(); }).then(function (data) {
      if (data.comentario) comments = comments.map(function (x) { return x.id === id ? data.comentario : x; });
      paint();
    }).catch(function () { btn.disabled = false; });
  });
  document.getElementById("csv").addEventListener("click", function () {
    var cols = ["id", "escenario", "pantalla", "nombre", "comentario", "vista", "estado", "creado", "resuelto"];
    var lines = [cols.join(",")].concat(comments.map(function (c) {
      var row = Object.assign({ pantalla: titles[c.escenario] || "" }, c);
      return cols.map(function (k) { return '"' + String(row[k] == null ? "" : row[k]).replace(/"/g, '""') + '"'; }).join(",");
    }));
    var blob = new Blob(["\ufeff" + lines.join("\n")], { type: "text/csv;charset=utf-8" });
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = "comentarios-star-" + new Date().toISOString().slice(0, 10) + ".csv";
    a.click();
    URL.revokeObjectURL(a.href);
  });
  fetch("/api/comentarios").then(function (r) { return r.json(); }).then(function (data) {
    comments = data.comentarios || [];
    paint();
  }).catch(function () {
    rows.innerHTML = '<tr><td colspan="6" class="comments-table__empty">No se pudieron cargar los comentarios.</td></tr>';
  });
})();
</script>
<script>
// Pestañas de la administración (patrón de pestañas WAI-ARIA, con recordatorio en la URL: #notas).
(function () {
  var tabs = Array.prototype.slice.call(document.querySelectorAll('[role="tab"]'));
  function select(tab, focus) {
    tabs.forEach(function (t) {
      var on = t === tab;
      t.setAttribute("aria-selected", String(on));
      t.tabIndex = on ? 0 : -1;
      document.getElementById(t.getAttribute("aria-controls")).hidden = !on;
    });
    if (focus) tab.focus();
    history.replaceState(null, "", tab.id === "tab-notas" ? "#notas" : "#comentarios");
    document.dispatchEvent(new CustomEvent("tab:" + tab.id));
  }
  tabs.forEach(function (tab, i) {
    tab.addEventListener("click", function () { select(tab); });
    tab.addEventListener("keydown", function (e) {
      if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
        e.preventDefault();
        select(tabs[(i + (e.key === "ArrowRight" ? 1 : tabs.length - 1)) % tabs.length], true);
      }
    });
  });
  select(location.hash === "#notas" ? tabs[1] : tabs[0]);
})();

// Notas de reuniones: una por fecha, con guardado automático.
(function () {
  var fechaInput = document.getElementById("nota-fecha");
  var titulo = document.getElementById("nota-titulo");
  var contenido = document.getElementById("nota-contenido");
  var estado = document.getElementById("nota-estado");
  var dia = document.getElementById("nota-dia");
  var lista = document.getElementById("notas-lista");
  var current = null;
  var dirty = false;
  var timer = null;
  var started = false;
  var longDate = new Intl.DateTimeFormat("es-AR", { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  var shortDate = new Intl.DateTimeFormat("es-AR", { weekday: "short", day: "2-digit", month: "2-digit", year: "numeric" });
  var time = new Intl.DateTimeFormat("es-AR", { hour: "2-digit", minute: "2-digit" });

  function esc(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function pad(n) { return String(n).padStart(2, "0"); }
  function toIso(d) { return d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate()); }
  function parse(iso) { var p = iso.split("-").map(Number); return new Date(p[0], p[1] - 1, p[2]); }
  function capitalize(t) { return t.charAt(0).toUpperCase() + t.slice(1); }
  function setStatus(text, error) {
    estado.textContent = text;
    estado.classList.toggle("is-error", !!error);
  }

  function save() {
    if (!dirty || !current) return Promise.resolve();
    dirty = false;
    var fecha = current;
    setStatus("Guardando…");
    return fetch("/api/notas/" + fecha, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ titulo: titulo.value, contenido: contenido.value }),
    })
      .then(function (r) {
        if (!r.ok) throw new Error();
        return r.json();
      })
      .then(function (data) {
        if (fecha === current) setStatus(data.nota.actualizado ? "Guardado a las " + time.format(new Date()) : "Nota vacía: no se guarda");
        loadList();
      })
      .catch(function () {
        dirty = true;
        setStatus("No se pudo guardar. Revisá la conexión; se reintenta al seguir escribiendo.", true);
      });
  }
  function flush() {
    clearTimeout(timer);
    return save();
  }
  function onEdit() {
    dirty = true;
    setStatus("Escribiendo…");
    clearTimeout(timer);
    timer = setTimeout(save, 700);
  }

  function open(fecha) {
    return flush().then(function () {
      current = fecha;
      fechaInput.value = fecha;
      dia.textContent = capitalize(longDate.format(parse(fecha)));
      titulo.value = "";
      contenido.value = "";
      setStatus("Cargando…");
      return fetch("/api/notas/" + fecha)
        .then(function (r) { return r.json(); })
        .then(function (data) {
          if (fecha !== current) return;
          titulo.value = data.nota.titulo || "";
          contenido.value = data.nota.contenido || "";
          setStatus(data.nota.actualizado ? "Última edición: " + capitalize(shortDate.format(new Date(data.nota.actualizado))) + ", " + time.format(new Date(data.nota.actualizado)) : "Sin notas para este día");
          paintSelection();
        })
        .catch(function () { setStatus("No se pudo cargar la nota.", true); });
    });
  }

  function loadList() {
    return fetch("/api/notas")
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var notas = data.notas || [];
        lista.innerHTML = notas.length
          ? notas.map(function (n) {
              var resumen = (n.resumen || "").split("\n").filter(Boolean)[0] || "";
              return '<li><button type="button" class="notes__item" data-fecha="' + n.fecha + '">' +
                '<span class="notes__item-date">' + esc(capitalize(shortDate.format(parse(n.fecha)))) + "</span>" +
                '<strong>' + esc(n.titulo || "Sin título") + "</strong>" +
                (resumen ? '<span class="notes__item-text">' + esc(resumen) + "</span>" : "") +
                "</button></li>";
            }).join("")
          : '<li class="notes__empty">Todavía no hay reuniones anotadas. Elegí una fecha y empezá a escribir.</li>';
        paintSelection();
      });
  }
  function paintSelection() {
    lista.querySelectorAll("[data-fecha]").forEach(function (b) {
      b.setAttribute("aria-current", b.getAttribute("data-fecha") === current ? "date" : "false");
    });
  }

  function start() {
    if (started) return;
    started = true;
    open(toIso(new Date()));
    loadList();
  }

  titulo.addEventListener("input", onEdit);
  contenido.addEventListener("input", onEdit);
  fechaInput.addEventListener("change", function () {
    if (/^\d{4}-\d{2}-\d{2}$/.test(fechaInput.value)) open(fechaInput.value);
  });
  document.getElementById("nota-hoy").addEventListener("click", function () { open(toIso(new Date())); });
  document.querySelectorAll(".notes__step").forEach(function (b) {
    b.addEventListener("click", function () {
      var d = parse(current || toIso(new Date()));
      d.setDate(d.getDate() + Number(b.getAttribute("data-step")));
      open(toIso(d));
    });
  });
  lista.addEventListener("click", function (e) {
    var item = e.target.closest("[data-fecha]");
    if (item) open(item.getAttribute("data-fecha"));
  });
  document.getElementById("nota-borrar").addEventListener("click", function () {
    if (!current || (!titulo.value && !contenido.value)) return;
    if (!window.confirm("¿Borrar la nota de este día? No se puede deshacer.")) return;
    clearTimeout(timer);
    dirty = false;
    fetch("/api/notas/" + current, { method: "DELETE" }).then(function () {
      titulo.value = "";
      contenido.value = "";
      setStatus("Nota borrada");
      loadList();
    });
  });
  // Si se cierra la pestaña con cambios sin guardar, se mandan igual.
  window.addEventListener("pagehide", function () {
    if (!dirty || !current) return;
    fetch("/api/notas/" + current, {
      method: "PUT",
      keepalive: true,
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ titulo: titulo.value, contenido: contenido.value }),
    });
  });

  document.addEventListener("tab:tab-notas", start);
  if (!document.getElementById("panel-notas").hidden) start();
})();
</script>
</body>
</html>
