<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#030a15">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SullairGo">
<title>Proyecto STAR · SullairGo</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/assets/img/icon-180.png">
<link rel="manifest" href="/assets/manifest.webmanifest">
<link rel="stylesheet" href="/assets/css/sgo-tokens.css">
<link rel="stylesheet" href="/assets/css/sgo-components.css">
<link rel="stylesheet" href="/assets/css/portal.css">
</head>
<body class="page page--hub">
<header class="topbar">
  <a class="topbar__brand" href="/" aria-label="Escenarios">
    <img src="/assets/img/sullairgo-logo.jpg" alt="SullairGo" class="logo-on-dark">
    <span class="topbar__project">Proyecto STAR</span>
  </a>
  <a class="topbar__action" href="/salir">Salir</a>
</header>
<main class="hub">
  <div class="hub__header">
    <p class="eyebrow">SullairGo · Seguimiento de visita técnica</p>
    <h1>Escenarios</h1>
  </div>
  <div id="hub-sections"></div>
  <a class="hub__board" href="/board">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
    Board de diseño
  </a>
</main>
<script src="/app/data.js"></script>
<script>
// Lista de escenarios: sale de app/data.js, la misma fuente que usa la app.
(function () {
  var D = window.STAR;
  function esc(t) {
    return String(t).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  var arrow = '<svg class="scenario-link__arrow" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
  document.getElementById("hub-sections").innerHTML = D.GROUPS.map(function (g, gi) {
    var items = D.SCENARIOS.filter(function (s) { return s.group === g.id; }).map(function (s, i) {
      return '<li style="--i:' + i + '"><a class="scenario-link" href="/escenarios/' + s.id + '">' +
        '<span class="scenario-link__thumb"><img src="/assets/img/thumbs/' + s.id + '.jpg" alt="" loading="lazy"></span>' +
        '<span class="scenario-link__body"><span class="code">' + esc(s.id) + '</span>' +
        '<span class="scenario-link__text"><span class="scenario-link__title">' + esc(s.title) + '</span>' +
        '<span class="scenario-link__meta" data-meta="' + s.id + '">' + (s.kind === "agenda" ? "Interactivo" : "Seguimiento en vivo") + '</span></span>' + arrow +
        '</span></a></li>';
    }).join("");
    return '<section class="hub__section" aria-labelledby="grupo-' + gi + '"><h2 id="grupo-' + gi + '">' + esc(g.title) + '</h2>' +
      '<ul class="scenario-grid" role="list">' + items + '</ul></section>';
  }).join("");

  // Comentarios abiertos por pantalla.
  fetch("/api/comentarios").then(function (r) { return r.json(); }).then(function (data) {
    var open = {};
    (data.comentarios || []).forEach(function (c) {
      if (c.estado !== "resuelto") open[c.escenario] = (open[c.escenario] || 0) + 1;
    });
    Object.keys(open).forEach(function (id) {
      var meta = document.querySelector('[data-meta="' + id + '"]');
      if (meta) meta.textContent += " · " + open[id] + (open[id] === 1 ? " comentario" : " comentarios");
    });
  }).catch(function () {});
})();
</script>
</body>
</html>
