<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Acceso · Proyecto STAR</title>
<link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/css/sgo-tokens.css">
<link rel="stylesheet" href="/assets/css/sgo-components.css">
<link rel="stylesheet" href="/assets/css/portal.css">
</head>
<body class="page--login">
<svg class="login__pattern" viewBox="0 0 390 240" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><circle cx="54" cy="42" r="44" fill="none" stroke="#8fd0b4" stroke-width="9"></circle><path d="M312 -12 A68 68 0 0 1 380 56 L312 56 Z" fill="#bfe6d4"></path><rect x="258" y="150" width="60" height="60" fill="#0f3a34" transform="rotate(18 288 180)"></rect></svg>

<main class="login">
  <div class="login__brand">
    <img src="/assets/img/sullairgo-logo.jpg" alt="SullairGo" class="logo-on-dark">
    <p>Proyecto STAR</p>
  </div>

  <form class="login__card" method="post" action="/login" novalidate>
    <h1>Acceso privado</h1>
    <input type="hidden" name="next" value="/">
    <div class="field" id="field-password">
      <label for="password">Contraseña</label>
      <p class="field__error" id="password-error" role="alert">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></svg>
        <span>La contraseña no es correcta.</span>
      </p>
      <div class="field__control">
        <input id="password" name="password" type="password" autocomplete="current-password" required autofocus>
        <button type="button" class="field__toggle" aria-label="Mostrar contraseña" aria-pressed="false" aria-controls="password">
          <svg class="icon-show" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
          <svg class="icon-hide" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19c-6.4 0-10-7-10-7a18.4 18.4 0 0 1 5-5.9M9.9 5.2A9.1 9.1 0 0 1 12 5c6.4 0 10 7 10 7a18.5 18.5 0 0 1-2.2 3.2M14.1 14.1a3 3 0 1 1-4.2-4.2M2 2l20 20"/></svg>
        </button>
      </div>
    </div>
    <button type="submit" class="sgo-btn sgo-btn--primary sgo-btn--lg login__submit">Ingresar</button>
  </form>

  <p class="login__footer">Sullair Argentina · Business Transformation</p>
</main>

<script>
(function () {
  var params = new URLSearchParams(location.search);
  var next = params.get('next');
  if (next && next.charAt(0) === '/' && next.charAt(1) !== '/') {
    document.querySelector('input[name="next"]').value = next;
  }
  var input = document.getElementById('password');
  if (params.has('error')) {
    document.getElementById('field-password').classList.add('field--error');
    input.setAttribute('aria-invalid', 'true');
    input.setAttribute('aria-describedby', 'password-error');
  }
  var toggle = document.querySelector('.field__toggle');
  toggle.addEventListener('click', function () {
    var show = input.type === 'password';
    input.type = show ? 'text' : 'password';
    toggle.setAttribute('aria-pressed', String(show));
    toggle.setAttribute('aria-label', show ? 'Ocultar contraseña' : 'Mostrar contraseña');
    input.focus();
  });
  document.querySelector('form').addEventListener('submit', function (e) {
    if (!input.value) { e.preventDefault(); input.focus(); return; }
    var btn = document.querySelector('.login__submit');
    btn.setAttribute('aria-busy', 'true');
    btn.textContent = 'Ingresando…';
  });
})();
</script>
</body>
</html>
